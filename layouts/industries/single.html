{{ define "main" }}
<article style="max-width:900px;margin:0 auto;padding:40px 20px 60px;">
<h1 style="font-size:28px;font-weight:700;line-height:1.2;color:#1d1d1f;margin-bottom:12px;">{{ .Title }}</h1>

<div style="font-size:15px;line-height:1.7;color:#444;max-width:100%;overflow:hidden;">
<span style="display:none"></span><style scoped>p img{max-width:100%!important;height:auto!important;border-radius:8px}</style>
{{ .Content }}
</div>

<div style="margin-top:40px;padding-top:24px;border-top:1px solid #e0e0e0;">
<h3 style="font-size:16px;font-weight:600;margin-bottom:14px;">Featured Packaging Solutions</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
{{ range first 4 (shuffle (where .Site.RegularPages "Section" "products")) }}
<div class="card" style="padding:16px;">
<div style="font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3;">
<a href="{{ .RelPermalink }}" style="color:#1a56db;text-decoration:none;">{{ .Title | truncate 60 }}</a>
</div>
<div style="font-size:11px;color:#888;margin-bottom:6px;">{{ .Params.material | truncate 50 }}</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;">
<span class="pill-blue" style="font-size:10px;padding:2px 10px;">ISO 9001</span>
<span class="pill-orange" style="font-size:10px;padding:2px 10px;">MOQ {{ .Params.moq }}</span>
</div>
</div>
{{ end }}
</div>
<div style="text-align:center;margin-top:20px;">
<a href="/products/" class="btn-primary">View All 205+ Products</a>
</div>
</div>
</article>
{{ end }}
