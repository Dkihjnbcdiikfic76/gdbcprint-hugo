{{/* Hugo render-image hook — adds lazy loading + async decoding to all content images */}}
<img src="{{ .Destination | safeURL }}"
     alt="{{ .Text }}"
     {{ with .Title }}title="{{ . }}"{{ end }}
     loading="lazy"
     decoding="async"
     style="max-width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#f0f1f3;display:block;border-radius:8px">
